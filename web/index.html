<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Paper Planes</title>
<link rel=stylesheet href=/style.css>
</head>
<body>
<main>
<header>
  <h1>Paper Planes</h1><span id=pill class=pill>connecting</span>
  <nav><a href=/settings>Settings</a><a href=/api/nearest>JSON</a></nav>
</header>
<div class=panel>
  <div class=screen><img id=screen src=/screen.bmp alt="What the e-paper screen shows now"></div>
  <section class=hide id=hide hidden aria-label="Hide planes from the screen">
    <div class=hide-row id=hideRow>
      <span class=hide-what id=hideWhat>Hide <b id=hideName></b> for</span>
      <div class=seg id=seg role=group aria-labelledby=hideWhat>
        <button type=button data-h=1>1 h</button><button type=button data-h=3>3 h</button><button type=button data-h=8>8 h</button><button type=button data-h=24>1 day</button><button type=button data-h=0 title="Until you show it again">Forever</button>
      </div>
    </div>
    <p class=hide-msg id=hideMsg role=status aria-live=polite></p>
    <div class=hidden-list id=muted></div>
  </section>
</div>
<div class=card id=flight><h2>On screen</h2><p class=mute>Waiting for the first update...</p></div>
<div class=card><h2>Device</h2><dl id=device></dl></div>
<p class="mute hint">Updates every few seconds. <a href=/update>Firmware and data updates</a></p>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const item = (k, v) => v == null || v === '' ? '' : `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`;
const num = n => n == null ? null : Number(n).toLocaleString();
const BASIS = {
  confirmed: 'confirmed',
  scheduled: 'scheduled, fits its position',
  track: 'from what the plane is doing',
  mismatch: "scheduled, but it doesn't fit where the plane is",
};
const TREND = {up: 'climbing', down: 'descending', level: 'level'};

function ago(t) {
  if (!t) return null;
  const s = Math.max(0, Date.now() / 1000 - t);
  return s < 90 ? Math.round(s) + ' s ago' : Math.round(s / 60) + ' min ago';
}
function uptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}

function flightHtml(st) {
  const f = st.flight;
  if (/^night/.test(st.status)) return `<p>The screen is off for the night (${esc(st.status.replace(/^night, /, ''))}).</p>`;
  if (!f) return '<p class=mute>Waiting for the first update...</p>';
  if (f.status !== 'ok') return `<p>Nothing airborne within ${f.radius_nm} nm.</p><p class=mute>Checked ${esc(ago(f.updated) || '')}</p>`;
  const r = f.route;
  let h = '';
  if (r) {
    const to = r.to ? `${esc(r.to.code)} <small>${esc(r.to.city)}</small>` : '<small>destination not yet known</small>';
    h += `<div class=route>${esc(r.from.code)} <small>${esc(r.from.city)}</small> &rarr; ${to}</div>`;
  }
  return h + '<dl>'
    + item('Flight', f.flight) + item('Airline', f.airline && f.airline.name) + item('Aircraft', f.type_name)
    + item('Registration', f.reg) + item('Altitude', f.alt_ft != null ? num(f.alt_ft) + ' ft, ' + TREND[f.vtrend] : null)
    + item('Ground speed', f.gs_kt != null ? f.gs_kt + ' kt' : null) + item('Heading', f.track_deg != null ? f.track_deg + '°' : null)
    + item('Distance', `${f.dist_nm} nm ${f.compass || ''}`) + item('Squawk', f.squawk + (f.emergency ? ' (emergency)' : ''))
    + item('Route', r ? BASIS[r.basis] : null)
    + item('In range', f.in_range + ' aircraft within ' + f.radius_nm + ' nm') + item('ICAO hex', f.hex)
    + item('Updated', ago(f.updated)) + '</dl>';
}

function left(until) {
  if (until == null) return 'forever';
  const m = Math.max(1, Math.round((until - Date.now() / 1000) / 60));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
}
const forText = h => h == 0 ? 'until you show it again' : h == 24 ? 'for a day' : `for ${h} hour${h == 1 ? '' : 's'}`;

let onScreen = null;   // {hex, label} of the plane shown now
let chipsHtml = '';    // redrawn only when it changes, so keyboard focus stays put
let msgTimer = 0;
function say(html, warn) {
  const m = $('#hideMsg');
  m.innerHTML = html;
  m.classList.toggle('warn', !!warn);
  clearTimeout(msgTimer);
  if (html) msgTimer = setTimeout(() => { say(''); $('#hide').hidden = !onScreen && !chipsHtml; }, 12000);
}

function drawMutes(st) {
  const f = st.flight;
  onScreen = f && f.status === 'ok' && f.hex ? {hex: f.hex, label: f.reg || f.flight || ''} : null;
  const list = st.mutes || [];
  $('#hideRow').hidden = !onScreen;
  if (onScreen) $('#hideName').textContent = onScreen.label || onScreen.hex;
  // Timed choices need the board's clock; "Forever" doesn't.
  for (const b of document.querySelectorAll('#seg [data-h]:not([data-h="0"])')) {
    b.disabled = st.clock_set === false;
    b.title = b.disabled ? "Waiting for the board's clock" : '';
  }
  const html = list.length ? '<span class=hidden-label id=hiddenLabel>Hidden</span><ul class=chips aria-labelledby=hiddenLabel>' + list.map(m => {
    const name = esc(m.label || m.hex);
    return `<li class=chip title="ICAO ${esc(m.hex)}"><b>${name}</b><span>${esc(left(m.until))}</span>`
      + `<button type=button data-unmute="${esc(m.hex)}" aria-label="Show ${name} again">&times;</button></li>`;
  }).join('') + '</ul>' : '';
  if (html !== chipsHtml) { chipsHtml = html; $('#muted').innerHTML = html; }
  $('#hide').hidden = !onScreen && !list.length && !$('#hideMsg').innerHTML;
}

const WHY = {
  401: 'That needs the settings password.',
  403: 'Refused: open this page from the board itself.',
};
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', body: new URLSearchParams(body)});
  if (!r.ok) throw new Error(WHY[r.status] || (await r.text()) || r.statusText);
  return r.json();
}

$('#seg').addEventListener('click', async e => {
  const b = e.target.closest('[data-h]');
  if (!b || b.disabled || !onScreen) return;
  const p = onScreen, name = esc(p.label || p.hex), h = b.dataset.h, seg = $('#seg');
  seg.setAttribute('aria-busy', 'true');
  b.classList.add('busy');
  try {
    await post('/api/mute', {...p, hours: h});
    say(`<b>${name}</b> is hidden ${forText(h)}. Finding the next plane&hellip; <button type=button class=link data-unmute="${esc(p.hex)}">Undo</button>`);
    await refresh();
  } catch (err) { say(esc(err.message), true); }
  seg.removeAttribute('aria-busy');
  b.classList.remove('busy');
});
$('#hide').addEventListener('click', async e => {
  const b = e.target.closest('[data-unmute]');
  if (!b) return;
  b.disabled = true;
  try { await post('/api/unmute', {hex: b.dataset.unmute}); say(''); await refresh(); }
  catch (err) { b.disabled = false; say(esc(err.message), true); }
});

let frame = -1;
function draw(st) {
  drawMutes(st);
  const d = st.device;
  const pill = $('#pill');
  pill.textContent = st.status;
  pill.className = 'pill ' + (/^(live|demo)/.test(st.status) ? 'ok' : /no |setup|can't/i.test(st.status) ? 'bad' : '');
  if (st.frame !== frame) { frame = st.frame; $('#screen').src = '/screen.bmp?f=' + frame; }
  $('#flight').innerHTML = '<h2>On screen</h2>' + flightHtml(st);
  $('#device').innerHTML = item('Address', `${d.hostname} (${d.ip})`)
    + item('Wi-Fi', d.mode === 'setup' ? 'setup hotspot' : `${d.ssid}, ${d.rssi} dBm`)
    + item('Home', `${d.home.lat.toFixed(4)}, ${d.home.lon.toFixed(4)} (${d.radius_nm} nm)`)
    + item('Night hours', d.night ? d.night.replace('-', ' to ') : 'off')
    + item('Airport data', d.airports)
    + item('Firmware', d.version) + item('Up', uptime(d.uptime_s))
    + item('Free memory', Math.round(d.heap / 1024) + ' KB' + (d.psram ? `, PSRAM ${Math.round(d.psram / 1024)} KB` : ''));
}

async function refresh() {
  try { draw(await (await fetch('/api/state', {cache: 'no-store'})).json()); }
  catch (e) { $('#pill').textContent = 'not responding'; $('#pill').className = 'pill bad'; }
}
async function tick() {
  await refresh();
  setTimeout(tick, 4000);
}
tick();
</script>
</body>
</html>
