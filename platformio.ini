; paper-planes: the nearest aircraft on the CrowPanel 5.79" e-paper board.
;   pio run -t upload        build, flash firmware + airport data over USB
;   pio run -t uploadairports   flash only the airport data
;   pio test -e native       unit + parity tests on this PC (needs a host g++)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[common]
lib_deps =
	bblanchon/ArduinoJson@^7.2.1
; -Isrc: "generated/..." and "app/..." resolve from src/ everywhere (lib/ too).
build_flags = -Wall -Isrc
extra_scripts = pre:tools/pio_generate.py

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
; ESP32-S3R8: 8 MB octal PSRAM in the chip (esptool: "Embedded PSRAM 8MB").
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
upload_speed = 921600
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_flags = ${common.build_flags} -DBOARD_HAS_PSRAM

; Host tests: lib/flights, lib/settings, lib/panel and the parity fixtures in
; test/fixtures (made by tools/make_fixtures.py from flight-tracker's own code).
[env:native]
platform = native
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_flags = ${common.build_flags} -std=gnu++17
build_src_filter = -<*>
lib_ignore = EPD_Driver
test_framework = unity
